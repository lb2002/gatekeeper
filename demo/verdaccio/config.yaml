# Local test registry for the demo. The villain package exists only here.
storage: ./storage
auth:
  htpasswd:
    file: ./htpasswd
    max_users: 1
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
packages:
  'axois-retry':
    access: $all
    publish: $all  # local-only demo registry (listens on 127.0.0.1), no account needed
  '**':
    access: $all
    publish: $authenticated
    proxy: npmjs
listen: 127.0.0.1:4873
log: { type: stdout, format: pretty, level: warn }
