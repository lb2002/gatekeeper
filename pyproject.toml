[project]
name = "gatekeeper"
version = "0.1.0"
description = "Static malware detection for npm packages with Meta's Muse models: a live registry monitor and an install guard for humans and AI coding agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
gk = "gatekeeper.cli:app"

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gatekeeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
