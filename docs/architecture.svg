<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Gatekeeper architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b66"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#d7d7cf;stroke-width:1.5}
      .meta{fill:#eef3ff;stroke:#7a9cff;stroke-width:1.5}
      .proof{fill:#f3faf2;stroke:#6fbf73;stroke-width:1.5}
      .guard{fill:#fff4f2;stroke:#e0786d;stroke-width:1.5}
      .t{font-size:19px;font-weight:600;fill:#1d1d1b}
      .s{font-size:14.5px;fill:#55554f}
      .n{font-size:13px;fill:#8a8a84}
      .h{font-size:15px;font-weight:700;fill:#8a8a84;letter-spacing:1.5px}
      .line{stroke:#6b6b66;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fbfbf9"/>

  <text x="48" y="58" class="h">LIVE MONITOR · MODAL · EVERY 2 MINUTES</text>

  <!-- row 1: funnel -->
  <rect class="box" x="48" y="80" width="200" height="118" rx="10"/>
  <text x="66" y="114" class="t">npm feed</text>
  <text x="66" y="140" class="s">every new release</text>
  <text x="66" y="162" class="s">~90k versions a day</text>
  <text x="66" y="184" class="n">never executed</text>

  <rect class="box" x="290" y="80" width="214" height="118" rx="10"/>
  <text x="308" y="114" class="t">Metadata triage</text>
  <text x="308" y="140" class="s">install hooks, typosquats,</text>
  <text x="308" y="162" class="s">new packages, OSV-listed</text>
  <text x="308" y="184" class="s">dependencies</text>

  <rect class="box" x="546" y="80" width="214" height="118" rx="10"/>
  <text x="564" y="114" class="t">Archive scan</text>
  <text x="564" y="140" class="s">in memory: static rules +</text>
  <text x="564" y="162" class="s">classifier, private deps</text>
  <text x="564" y="184" class="n">~15% of versions</text>

  <rect class="meta" x="802" y="80" width="214" height="118" rx="10"/>
  <text x="820" y="114" class="t">Llama Guard 3 1B</text>
  <text x="820" y="140" class="s">fine-tuned safety net</text>
  <text x="820" y="162" class="s">over every scanned</text>
  <text x="820" y="184" class="s">archive</text>

  <rect class="box" x="1058" y="80" width="174" height="118" rx="10"/>
  <text x="1076" y="114" class="t">Evidence</text>
  <text x="1076" y="140" class="s">numbered code</text>
  <text x="1076" y="162" class="s">excerpts</text>
  <text x="1076" y="184" class="n">≤ 8,000 chars</text>

  <path class="line" d="M248,139 H286"/>
  <path class="line" d="M504,139 H542"/>
  <path class="line" d="M760,139 H798"/>
  <path class="line" d="M1016,139 H1054"/>

  <!-- row 2: Meta models -->
  <text x="48" y="262" class="h">META MODELS JUDGE EVERY FLAG · VERDICTS MUST CITE LINES</text>
  <rect class="meta" x="48" y="282" width="360" height="104" rx="10"/>
  <text x="66" y="316" class="t">Muse Spark Open: verdict + investigator</text>
  <text x="66" y="342" class="s">reads the archive step by step, cites lines</text>
  <text x="66" y="364" class="n">Fireworks / Baseten · checked by code</text>

  <rect class="meta" x="460" y="282" width="360" height="104" rx="10"/>
  <text x="478" y="316" class="t">Muse Spark 1.3</text>
  <text x="478" y="342" class="s">Meta Model API · second opinion</text>
  <text x="478" y="364" class="n">hard daily spending caps</text>

  <rect class="meta" x="872" y="282" width="360" height="104" rx="10"/>
  <text x="890" y="316" class="t">Muse Glimmer 30B</text>
  <text x="890" y="342" class="s">open weights, on a laptop GPU</text>
  <text x="890" y="364" class="n">llama.cpp, Q4_K_M</text>

  <path class="line" d="M1145,198 V240 H228 V278"/>
  <path class="line" d="M640,240 V278"/>
  <path class="line" d="M1052,240 V278"/>

  <!-- row 3: proof and reporting -->
  <text x="48" y="450" class="h">PROOF AND REPORTING</text>
  <rect class="proof" x="48" y="470" width="360" height="104" rx="10"/>
  <text x="66" y="504" class="t">Public ledger</text>
  <text x="66" y="530" class="s">salted hash of every flag within 2 min,</text>
  <text x="66" y="552" class="s">OpenTimestamps (Bitcoin)</text>

  <rect class="proof" x="460" y="470" width="360" height="104" rx="10"/>
  <text x="478" y="504" class="t">Hourly confirmation</text>
  <text x="478" y="530" class="s">OSV · GitHub advisories · npm takedowns;</text>
  <text x="478" y="552" class="s">live recall; sweep of reported accounts</text>

  <rect class="proof" x="872" y="470" width="360" height="104" rx="10"/>
  <text x="890" y="504" class="t">Reports to OpenSSF</text>
  <text x="890" y="530" class="s">human review, or automatic when</text>
  <text x="890" y="552" class="s">the static proof is unambiguous</text>

  <path class="line" d="M228,386 V466"/>
  <path class="line" d="M640,386 V466"/>
  <path class="line" d="M1052,386 V466"/>

  <!-- guard -->
  <rect class="guard" x="48" y="610" width="1184" height="78" rx="10"/>
  <text x="66" y="642" class="t">Install guard (your machine, offline)</text>
  <text x="66" y="668" class="s">npm / npx for people and AI agents → OSV list of 222k malicious names → archive read in memory → Muse Glimmer judges → block, or hold versions younger than 24 h</text>
</svg>
